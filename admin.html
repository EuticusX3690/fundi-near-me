<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Fundi Near Me</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#F4F7F5;color:#16203A;padding:16px}
.box{max-width:640px;margin:0 auto}
h1{margin:0 0 4px} p{color:#5F6B7F}
.card{background:#fff;border:2px solid #DDE4E0;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px}
.meta{color:#5F6B7F;font-size:.92rem}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{flex:1;padding:12px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;min-width:100px}
.approve{background:#2DB36A;color:#fff}
.approve:disabled{background:#ccc;color:#666;cursor:not-allowed}
.reject{background:#fff;border:2px solid #D93F3F;color:#D93F3F}
.delete{background:#fff;border:2px solid #DDE4E0;color:#666}
label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;background:#E4F5EB;padding:10px;border-radius:10px;cursor:pointer}
label input{width:18px;height:18px}
.empty{text-align:center;color:#5F6B7F;padding:20px}
a{color:#2DB36A}
.top{display:flex;justify-content:space-between;align-items:center}
.refresh{background:#151B2B;color:#fff}
</style>
</head>
<body>
<div class="box">
<div class="top"><div><h1>Admin</h1><p>Fundi Near Me — Approve fundis</p></div><button class="refresh" onclick="loadAll()" style="flex:none;padding:10px 16px">Refresh</button></div>
<p><a href="./index.html">← Back to app</a></p>
<h2>Pending applications (<span id="pcount">0</span>)</h2>
<div id="pending"><div class="empty">Loading...</div></div>
<h2>Approved fundis (<span id="acount">0</span>)</h2>
<div id="approved"><div class="empty">Loading...</div></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBUS8DXq0NAKrnEJNQg7MmSlOjqyobS8sg",authDomain:"fundi-near-me-273c0.firebaseapp.com",projectId:"fundi-near-me-273c0",storageBucket:"fundi-near-me-273c0.firebasestorage.app",messagingSenderId:"729204944702",appId:"1:729204944702:web:27c89c9ecb453d8788866f"};
const db=getFirestore(initializeApp(cfg));
function esc(s){var d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
window.loadAll=async function(){
var pend=document.getElementById("pending"); var appr=document.getElementById("approved");
try{
var snap=await getDocs(collection(db,"applications"));
var apps=snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>a.status!=="approved");
document.getElementById("pcount").textContent=apps.length;
if(!apps.length) pend.innerHTML='<div class="empty">No pending applications.</div>';
else pend.innerHTML=apps.map(a=>{return '<div class="card"><h3>'+esc(a.name)+' — '+esc(a.trade)+'</h3><div class="meta">📍 '+esc(a.area)+' &middot; 📞 '+esc(a.phone)+'</div><div class="meta">Price: UGX '+(a.price?Number(a.price).toLocaleString():'-')+'</div><p>'+esc(a.about||"")+'</p><label><input type="checkbox" onchange="document.getElementById(\'ap-'+a.id+'\').disabled=!this.checked"> ID checked - ID photo received on WhatsApp</label><div class="row"><button class="approve" id="ap-'+a.id+'" disabled onclick="approveFundi(\''+a.id+'\')">Approve</button><button class="reject" onclick="rejectFundi(\''+a.id+'\')">Reject</button></div></div>'}).join("");
var snap2=await getDocs(collection(db,"fundis"));
var fundis=snap2.docs.map(d=>({id:d.id,...d.data()}));
document.getElementById("acount").textContent=fundis.length;
if(!fundis.length) appr.innerHTML='<div class="empty">No approved fundis yet.</div>';
else appr.innerHTML=fundis.map(f=>{return '<div class="card"><h3>'+esc(f.name)+' — '+esc(f.trade)+'</h3><div class="meta">📍 '+esc(f.area)+' &middot; 📞 '+esc(f.phone)+' &middot; From UGX '+(f.price?Number(f.price).toLocaleString():'-')+'</div><div class="row"><button class="delete" onclick="removeFundi(\''+f.id+'\')">Remove</button></div></div>'}).join("");
}catch(e){pend.innerHTML='<div class="empty">Could not load. '+esc(e.message)+'</div>'}
};
window.approveFundi=async function(id){
if(!confirm("Approve this fundi? They will appear in the app.")) return;
try{
var snap=await getDocs(collection(db,"applications")); var found=null; snap.docs.forEach(d=>{if(d.id===id) found={id:d.id,...d.data()}});
if(!found){alert("Not found");return}
await addDoc(collection(db,"fundis"),{name:found.name,phone:String(found.phone).replace(/^0/,"256"),trade:found.trade,area:found.area,price:found.price,about:found.about||"",verified:true,services:[],photos:[],photo:"",pay:["Cash","Mobile Money"]});
await deleteDoc(doc(db,"applications",id)); alert("Approved! "+found.name+" is now live."); loadAll();
}catch(e){alert("Error: "+e.message)}
};
window.rejectFundi=async function(id){if(!confirm("Reject and delete?")) return; await deleteDoc(doc(db,"applications",id)); loadAll();};
window.removeFundi=async function(id){if(!confirm("Remove this fundi?")) return; await deleteDoc(doc(db,"fundis",id)); loadAll();};
loadAll();
</script>
</body>
</html>
