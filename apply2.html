<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply as Fundi</title>
<style>
body{font-family:sans-serif;padding:20px;max-width:500px;margin:auto}
input,select,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
button{background:#16a34a;color:white;border:none;border-radius:8px}
</style>
</head>
<body>
<h2>Apply as Fundi</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone e.g. 0701234567">
<select id="skill">
<option>Plumber</option>
<option>Electrician</option>
<option>Carpenter</option>
<option>Builder</option>
<option>Painter</option>
</select>
<input id="location" placeholder="Location e.g. Kampala">
<button id="saveBtn">Save Application</button>
<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUS8DXq0NAKrnEJNQg7MmSlOjqyobS8sg",
  authDomain: "fundi-near-me-273c0.firebaseapp.com",
  projectId: "fundi-near-me-273c0",
  storageBucket: "fundi-near-me-273c0.firebasestorage.app",
  messagingSenderId: "729204944702",
  appId: "1:729204944702:web:27c89c9ecb453d8788866f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("saveBtn").onclick = async () => {
  const msg = document.getElementById("msg");
  msg.textContent = "Saving...";
  try {
    await addDoc(collection(db, "fundis"), {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      skill: document.getElementById("skill").value,
      location: document.getElementById("location").value,
      createdAt: new Date()
    });
    msg.textContent = "SAVED! ✅ Check Firestore.";
  } catch(e) {
    msg.textContent = "Error: " + e.message;
  }
};
</script>
</body>
</html>
