name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html fundis.json manifest.json sw.js firebase-config.js  www/
          cp *.png www/
          sed -i 's|fetch("fundis.json")|fetch("https://euticusx3690.github.io/fundi-near-me/fundis.json").catch(function(){ return fetch("fundis.json"); })|' www/index.html

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Fundi Near Me" com.euticus.fundinearme --web-dir www
          npx cap add android

      - name: Add location permission
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />|' android/app/src/main/AndroidManifest.xml

      - name: Set app icon
        run: |
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert app-512.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Fundi-Near-Me-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
