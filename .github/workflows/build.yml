name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          elif [ -f fundi-app.html ]; then
            cp fundi-app.html www/index.html
          else
            echo "ERROR: No index.html found!"
            exit 1
          fi
          cp *.png www/ 2>/dev/null || true

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/splash-screen@6 @capacitor/status-bar@6
          npx cap init "Fundi Near Me" com.euticus.fundinearme --web-dir www
          npx cap add android
          cat > capacitor.config.js << 'EOF'
          const config = {
            appId: 'com.euticus.fundinearme',
            appName: 'Fundi Near Me',
            webDir: 'www',
            backgroundColor: '#0F172A',
            android: { allowMixedContent: true },
            plugins: {
              SplashScreen: { launchShowDuration: 2000, launchAutoHide: true, backgroundColor: '#0F172A', showSpinner: false },
              StatusBar: { style: 'DARK', backgroundColor: '#0F172A', overlaysWebView: false }
            }
          };
          module.exports = config;
          EOF

      - name: Add location permission
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />|' android/app/src/main/AndroidManifest.xml

      - name: Set app icon
        run: |
          if [ -f app-512.png ]; then
            sudo apt-get install -y imagemagick
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}
              s=${d##*:}
              for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
                convert app-512.png -resize ${s}x${s} $R/mipmap-$n/$f.png
              done
            done
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/fundi-release.keystore

      - name: Build RELEASE APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/fundi-release.keystore -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Fundi-Near-Me-APK
          path: android/app/build/outputs/apk/release/app-release.apk
