.ok{color:var(--g);font-weight:600}
.trade{margin:10px 0 4px;color:var(--mute)}
.about{margin:0 0 12px}
.btns{display:flex;gap:10px}
.btn{flex:1;text-align:center;padding:12px;border-radius:12px;font-weight:800;text-decoration:none}
.wa{border:2px solid var(--g);color:var(--g)}
.call{background:var(--grad);color:#fff}
.empty{text-align:center;color:var(--mute);padding:30px 0}

.perks{padding-left:20px;margin:10px 0 0}
.perks li{margin-bottom:6px}
.form label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
.form input,.form select{width:100%;padding:12px;font:inherit;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:12px}
.note{color:var(--mute);font-size:.9rem;margin:10px 0 0}
.from{color:var(--g);font-weight:800}
.free{display:inline-block;background:var(--gsoft);color:var(--g);font-weight:800;padding:4px 12px;border-radius:999px;margin-top:6px}
.all.join{background:none;border:2px solid var(--g);color:var(--g)}
.back{background:none;border:0;color:var(--g);font:inherit;font-weight:800;padding:0;margin-bottom:6px;min-height:44px;cursor:pointer}
.pic.big{width:72px;height:72px;font-size:2.2rem}
.namebtn{background:none;border:0;padding:0;font:inherit;font-weight:800;font-size:1.1rem;color:var(--ink);text-align:left;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.nophoto{grid-column:1/-1;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mute)}
.mapbtn{display:block;margin-top:10px}

nav a{color:var(--mute);text-decoration:none;font-weight:600;font-size:.9rem;text-align:center;padding:4px 14px}
nav a.on{color:var(--g)}
nav a span{display:block;font-size:1.5rem;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .all{margin-top:0;flex:1;width:auto;padding:10px 4px;font-size:.85rem}

.tile span img{width:30px;height:30px}
