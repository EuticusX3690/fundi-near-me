<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundi Near Me</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0F172A;color:white;padding:16px;padding-bottom:90px}
body.light{background:#F1F5F9;color:#0F172A}
body.light .card,body.light .box,body.light .cat{background:white;color:#0F172A;border:1px solid #E2E8F0}
#splash{position:fixed;inset:0;background:#0F172A;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#splash h1{font-size:36px}#splash h1 span{color:#22C55E}#splash p{color:#94A3B8;margin-top:8px;font-size:14px}
#splash .loader{width:40px;height:40px;border:3px solid #1E293B;border-top:3px solid #22C55E;border-radius:50%;margin-top:22px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top{display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:26px}.top h1 span{color:#22C55E}
.gear{font-size:22px;cursor:pointer;background:#1E293B;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.search{margin:14px 0}.search input{width:100%;padding:13px;border-radius:14px;border:0;background:#1E293B;color:white;outline:none}
.cats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin:12px 0}
.cat{background:#1E293B;border-radius:16px;padding:14px 6px;text-align:center;cursor:pointer}.cat div{font-size:28px}.cat b{font-size:12px;display:block;margin-top:6px}
.btn{background:#22C55E;color:#0F172A;border:0;padding:13px 18px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.btn2{background:transparent;color:#22C55E;border:2px solid #22C55E;padding:11px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.btnGrad{background:linear-gradient(90deg,#A7F3D0,#FBCFE8);color:#0F172A;border:0;padding:13px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.card{background:#1E293B;border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer}
.cardTop{display:flex;gap:12px;align-items:center}
.card img.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #22C55E;flex-shrink:0}
.badge{background:#DCFCE7;color:#166534;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
.badgeRed{background:#FEE2E2;color:#991B1B;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
.badgeGreen{background:#DCFCE7;color:#166534;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
.rowBtns{display:flex;gap:10px;margin-top:12px}.rowBtns button{flex:1}
.promo{background:#1E293B;border-radius:20px;padding:20px;text-align:center;margin-top:16px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:2px solid #334155;background:#0F172A;color:white;margin:6px 0;outline:none;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#22C55E;background:#1E293B}
label{font-size:13px;font-weight:700;color:#E2E8F0;margin-top:14px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;overflow-y:auto;padding:16px;z-index:99}.modal.open{display:block}
.box{background:#1E293B;border-radius:20px;padding:20px;max-width:480px;margin:20px auto}
.close{float:right;font-size:22px;cursor:pointer}
.works{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.works img{width:100%;height:130px;object-fit:cover;border-radius:12px;cursor:pointer}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid #22C55E}
.hidden{display:none}.adminCard{background:#0F172A;border:1px solid #334155;border-radius:14px;padding:12px;margin-bottom:10px}
.adminCard.owes{border:2px solid #EF4444;background:#1A0F0F}
.adminCard.paidup{border:2px solid #22C55E}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0F172A;border-top:1px solid #1E293B;display:flex;padding:10px 0;z-index:50}
.nav div{flex:1;text-align:center;font-size:12px;color:#94A3B8;cursor:pointer}.nav div.active{color:#22C55E;font-weight:800}
